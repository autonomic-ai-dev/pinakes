name: MCP Health Check
version: 2
min_spine_version: "0.19.0"
start_node: Doctor

nodes:
  - name: Doctor
    kind: agent
    description: "Run tekmor doctor and confirm hooks, git, the allowlist, and the store all report OK."

  - name: ProbeVerify
    kind: agent
    description: "Run tekmor verify receipt and tekmor verify summary; confirm a proof exists for the current tree or report which checks fail."

  - name: VerifySpine
    kind: agent
    description: "Run thesmos doctor, then thesmos validate workflows/bugfix.yaml; confirm the DAG parses and the engine reports ready. Fall back to scripts/run-workflow.sh validate workflows/bugfix.yaml when thesmos is absent."

  - name: Report
    kind: checkpoint
    description: "Summarize tekmor and thesmos status; if either reports unhealthy, record the failing check and open a follow-up."

edges:
  - from: Doctor
    to: ProbeVerify
  - from: ProbeVerify
    to: VerifySpine
  - from: VerifySpine
    to: Report
